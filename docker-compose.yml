services:
  app:
    image: ${DOCKER_USERNAME:?Set DOCKER_USERNAME}/nestjs-app:${IMAGE_TAG:?Set IMAGE_TAG}
    build:
      context: .
      target: production
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - '127.0.0.1:${PORT:-3000}:${PORT:-3000}'
    env_file:
      - .env
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/v1/health/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  migrate:
    image: ${DOCKER_USERNAME:?Set DOCKER_USERNAME}/nestjs-app-migration:${IMAGE_TAG:?Set IMAGE_TAG}
    build:
      context: .
      target: migration
    profiles: [tools]
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: 'no'
